# One-update PPO plumbing smoke test only.

algo: ppo

max_steps: 1
save_steps: 1
logging_steps: 1
learning_rate: 1.0e-6
max_grad_norm: 1.0
nonfinite_gradient_skip_limit: 0
per_device_train_batch_size: 2
gradient_accumulation_steps: 1
init_kl_coef: 0.05

num_ppo_epochs: 1
num_sample_generations: 0
max_prompt_length: 1024
response_length: 128
reward_timeout: 3.0

eval_reward_prompts: 1
eval_reward_samples: 1
