# Small reward-model fit for the PPO plumbing smoke test only.

algo: reward_model

num_train_epochs: 1
learning_rate: 1.0e-5
per_device_train_batch_size: 2
gradient_accumulation_steps: 1
max_length: 1024
logging_steps: 1
eval_fraction: 0.2

use_lora: false
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05

seed: 0
