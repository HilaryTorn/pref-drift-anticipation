[project]
name = "multi-livecodebench"
version = "0.1.1"
description = "Multi-LiveCodeBench"
readme = "README.md"
requires-python = "==3.11"
dependencies = [
    "pip>=25.2",
    "setuptools>=80.9",
    "wheel>=0.45.1",
    "pytest>=8.4.2",
    "datasets>=4.1.1",
    "openai>=1.109",
    "tqdm>=4.67.1",
    "numpy>=2.3.1",
    "pandas>=2.3.0",
    "httpx>=0.28.1",
    "pebble>=5.1.3",
    "torch>=2.7.1",
]

[project.optional-dependencies]
inference = [
    "anthropic>=0.42.0",
    "google-genai>=0.6.0",
    "mistralai==0.4.2",
    "together>=0.21.0",
    "openai>=1.59.6",
    "cohere>=5.13.6",
    "vllm>=0.5.0.post1",
]
 
[tool.setuptools.packages.find]
include = ["lcb_runner", "prompt_enhancer"]

[build-system]
requires = ["setuptools>=80.9"]
build-backend = "setuptools.build_meta"


[tool.pytest.ini_options]
testpaths = [ # what directories contain tests
    "tests",
]
pythonpath = [ # what to add to the python path
    "."
]
filterwarnings = [
"ignore:This process .*? is multi-threaded, use of fork:DeprecationWarning",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[tool.pixi.dependencies]
openjdk = ">=23.0.2"
python = ">=3.9.1"
rust = ">=1.77.2"
go = ">=1.24.5"
ruby = ">=3.4.4"
nodejs = ">=24.4.0"
deno = ">=2.3.4"
typescript = ">=5.7.3"
compilers = ">=1.10"
kotlin = ">=2.2.20"
scala3 = "==3.4.2"

[tool.pixi.target.linux-64.dependencies]
gcc = ">=13.3.0,<=14.2.0"
mono = ">=6.12"
php = ">=8.1.0"

[tool.pixi.target.osx-arm64.dependencies]
clang = "*"

[tool.pixi.target.win-64.dependencies]
clang = "*"
