version: 0.2

env:
  variables:
    EXPECTED_SHA: ""
    LCB_REFERENCE_S3_URI: ""
    LCB_LANGUAGE: ""
    LCB_EVAL_WORKERS: "16"

phases:
  install:
    commands:
      - python3 -m pip install --upgrade pip
      - docker build --file .aws/Dockerfile.lcb-verifier --tag lcb-verifier .
  pre_build:
    commands:
      - test -n "$EXPECTED_SHA"
      - test "$(cat SOURCE_COMMIT)" = "$EXPECTED_SHA"
      - |
        case "$LCB_LANGUAGE" in
          php|csharp) ;;
          *) echo "LCB_LANGUAGE must be php or csharp" >&2; exit 1 ;;
        esac
      - python3 -m pip install -r requirements-multilcb-gen.txt pytest pyyaml
      - |
        if [ -n "$LCB_REFERENCE_S3_URI" ]; then
          aws s3 sync "$LCB_REFERENCE_S3_URI" data/reference/multilcb/release_v5 --only-show-errors
        fi
      - python3 scripts/fetch_multilcb_dataset.py --release release_v5
      - python3 -m pytest -q tests/test_lcb_sft_languages.py
  build:
    commands:
      - cd "$CODEBUILD_SRC_DIR"
      - python3 scripts/rebuild_lcb_teacher_cache.py --language "$LCB_LANGUAGE" --k 1
      - python3 scripts/check_lcb_go_cache.py --language "$LCB_LANGUAGE" --k 1
      - >-
        docker run --rm --network none --memory 48g --cpus 8
        --pids-limit 4096 --ulimit stack=8589934592:8589934592
        --ulimit nofile=4096:4096 --cap-drop ALL
        --security-opt no-new-privileges
        --env LCB_LANGUAGE="$LCB_LANGUAGE"
        --env LCB_EVAL_WORKERS="$LCB_EVAL_WORKERS"
        --volume "$CODEBUILD_SRC_DIR:/workspace" --workdir /workspace
        lcb-verifier bash .aws/run-lcb-verifier.sh

artifacts:
  base-directory: multi-lcb/output
  files:
    - release_v5_lcb-php-teacher_cot/**/*
    - release_v5_lcb-csharp-teacher_cot/**/*
