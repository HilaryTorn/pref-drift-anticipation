# and this is not an inconsistency to "fix".
# Adapters: prism-drift/qwen35-27b-m0-v4-phase-1-lcb-sft-adapters, coding.write.rust/checkpoint-{88,176}.
# model_name carries the SIZE deliberately. The 4B keys serve under "lcb-rust-ep{1,2,3}" and the 9B
# under "lcb-9b-rust-ep{2,3}"; a bare "lcb-rust-ep2" here would write straight over the 4B multi-LCB
# output directory, which is exactly the collision that corrupted a 9B grading run.
# Adapter keys MUST be remapped before serving or vLLM applies nothing silently: the 27B M0 is
