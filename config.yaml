# 27B M0-v4 on a SELF-HOSTED vLLM (RunPod, 1x A100-80GB, TP1, bf16, vllm 0.28.0).
# Unlike the Together entry above, this is our own server, so the committed placeholder in
# api_keys/api_key_vllm_endpoint.txt ("dummy-key") IS the real key -- it just has to match
# `vllm serve --api-key`. No live credential ever goes in that tracked file.
# The 27B strand pins vllm 0.28.0, NOT the 0.25.0 used by the 4B/9B: 0.25.0 ships CUDA 13
# binaries that need a >=580 driver, and the pin exists to keep a baseline and its checkpoints
# on one serving stack -- a constraint that binds within a strand, not across strands. The 27B
# shares no hardware or numbers with the smaller sizes, so it gets its own pin. Do not move it
# mid-strand.
# base_url is the RunPod proxy for one specific pod and CHANGES whenever the pod is recreated. Do
# not edit it per pod: set PREF_DRIFT_BASE_URL at run time instead, so two pods serving the same
# weights run under ONE model_key and their replicates land in one results tree.
