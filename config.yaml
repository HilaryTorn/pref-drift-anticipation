# --- 27B Big5 openness arms: the pre-registered dose curve (trained 2026-09-08, 1 epoch) ---
# Same dataset as the 4B and 9B openness arms (big5.openness.{high,low}_n1000_seed42, 1000 examples at seed 42), so 125 optimizer steps at save_steps=4 and the pre-registered schedule is step 0 + 4 / 12 / 40 / 125 exactly as at the smaller sizes. Adapters: prism-drift/qwen35-27b-m0-v4-phase-2-big5-sft-adapters, big5.openness.{high,low}/checkpoint-{4,12,40,125}. LoRA r=16, alpha=32, and the target_modules are byte-identical to the 4B and 9B adapters (they include the hybrid `in_proj_*` linear-attn modules), so whatever vLLM does with those modules it does identically at all three sizes and the cross-size comparison is not disturbed.
# Only openness was trained at 27B. The high-vs-low contrast therefore confounds the openness TRAIT effect with the generic high-pole/low-pole REGISTER effect, which at 4B and 9B was 2-4x the trait effect. These keys answer "does the drift replicate at 27B", not "is it openness-specific" -- identifying that needs the two extraversion arms, which do not exist at this size. Do not feed these into analysis/big5_drift/compute_big5_drift.py's pole/trait decomposition; it needs all four arms.
# model_name carries the SIZE deliberately, per the LCB Rust precedent above: a bare "openness-high-step125" is the served name at BOTH 4B and 9B, and a crossed tunnel or a stale base_url would then score the wrong weights with no error anywhere.
# Adapter keys MUST be remapped before serving. Verified 2026-09-09 by reading the safetensors header: the tensors are `base_model.model.model.layers.N...` with no `language_model.` segment, while the 27B M0 is Qwen3_5ForConditionalGeneration and expects one. vLLM matches zero modules, logs "Loaded new LoRA adapter", and serves the bare base to every request. Run the step0-vs-adapter greedy diff before scoring anything.
# base_url is deliberately UNRESOLVABLE. These arms are driven over the RunPod proxy URL with PREF_DRIFT_BASE_URL set at run time (see private/docs/runpod-27b-runbook.md, trap #5). A localhost default here would silently score whatever another agent's concurrent pod happens to be serving on that port; a bogus host fails loudly on DNS instead.
