# ============================================================================
# experiments: read by main.py, see main.py --help.
#
# registry.<name>.path:       script path, relative to repo root
# registry.<name>.enabled:    whether `uv run main.py` (no args) includes it
# registry.<name>.positional: optional list of leading positional argv tokens,
#                              inserted before the --flags below (e.g. the
#                              subcommand name for run_elicitations.py, which
#                              uses argparse subparsers: task-preference /
#                              training-preference / anticipation).
# registry.<name>.args:       CLI flags to pass. Keys become `--<key>`
# run:            optional explicit order/subset of registry names for the
#                 default (no-args) invocation; omit to use registry order.
# stop_on_error:  stop the batch at the first failing script (default true).
#                 Override per-invocation with `uv run main.py --keep-going`.
#
# `uv run main.py --list` shows the registry and what would run by default. `uv run main.py <name>` runs one entry regardless of `enabled`/`run`.
# ============================================================================
experiments:
  # The M0 baseline battery, in methodology order. `python main.py --model_key <key>` runs exactly this list. (build_coding_elicitations / gen_value_portraits are data-build utilities, not scoring — run them by name when needed, not here.)
  run: [
      run_elicitations_task, # coding task preference   -> results/<model>/pairs
      run_elicitations_training, # coding training pref     -> results/<model>/pairs
      run_utilities_values, # value prefs (Schwartz)   -> results/<model>/values
      run_utilities_book_a, # coding+other pooled      -> results/<model>/book_a
      run_utilities_ue, # UE subset                -> results/<model>/ue
    ]
  # Baseline-only forecast (M0), not re-run per checkpoint. Add with `--anticipation`. Three arms: coding (ternary MORE/LESS/SAME), UE (ternary, cross-domain spillover), and values (ternary MORE/LESS/SAME over pooled value portraits).
  anticipation:
    [
      run_elicitations_anticipation,
      run_elicitations_ue_anticipation,
      run_values_anticipation,
    ]
  # The PER-CHECKPOINT battery — what we measure *during* training. Run with `--trajectory`.
  #
  # Methodology: "measure task preference during training ... Monitor all preferences chosen in Phase 0 AFTER to see if there are any unexpected shifts." So coding task preference is the drift signal and is scored densely at every checkpoint; values / Book A / UE are spillover checks and are scored only at the endpoints (M0 and the final checkpoint), not on the trajectory. Running the full `run:` battery at every checkpoint would score Book A (45 items) and UE (81 items) 4x per arm for numbers the design never asks for.
  trajectory: [run_elicitations_task]
  # The weight-changing Phase-1 coding SFT: seeded dataset prep, then LoRA training with dense checkpoint saves (n=1000 -> 125 optimizer steps at grad-accum 8, save_steps=4). Run with `python main.py --sft` from the pinned SFT env (uv sync / requirements-sft.txt) and WITHOUT --model_key — training changes weights, it does not read a served model.
  sft: [prepare_sft_dataset, train_sft_lora]
  # Measurement-validity checks, once per model — NOT the routine battery. Add with `--robustness`. score_label_variants covers the flat option pools (coding / other / UE); score_label_variants_values covers the values arm, which is now a flat pool like the rest and no longer needs the bespoke matched-pair checker retired on 2026-07-29 with its parent scorer. score_coding_capability is a different kind of check: not label/wording validity but whether the coding SFT trajectory is a real functional-correctness gain rather than only a preference-drift artifact — run it per checkpoint (e.g. step0 vs step125 of one arm), not once per model.
  robustness:
    [score_label_variants, score_label_variants_values, score_coding_capability]
  stop_on_error: true

  registry:
    build_coding_elicitations:
      path: scripts/build_coding_elicitations.py
      enabled: true # offline; only touches data/ artifacts
      args:
        check: true # validate existing artifacts; omit to rebuild them

    # RL-method stimuli are formal-only: the builder refuses synthetic samples and therefore stays disabled until SFT/GRPO/DPO/PPO real artifacts exist.
    build_rl_stimuli:
      path: scripts/build_rl_stimuli.py
      enabled: false
      args:
        check: true

    # gen_value_portraits (one-time generation of data/options/values.json via the Anthropic API) is deliberately NOT registered here — it's a data-build step, not an experiment. Run it directly if you ever need to regenerate portraits.

    score_label_variants:
      path: scripts/score_label_variants.py
      enabled: false # pass a live model_key via `-- --model_key <key>`
      args:
        options_path: [data/options/coding.json]
        # Coding robustness check: 6 pilot-aligned coding examples x 4 label schemes x 2 question wordings, scored reasoning-on (hard-sampling, K=10) so it actually exercises the elicitation the study runs, matching the values arm (score_label_variants_values below). With reasoning "on" and no config_key the scorer auto-selects thurstonian_active_learning; 8 variants x C(6,2)=15 pairs x 2 orders = ~240 prompts x K=10 ~= 2,400 generations. Keep max_options at 6. Setting it to 0 scores the full 27-option coding pool, an order of magnitude past what this once-per-model check should spend.
        #
        # The four schemes are one of each kind of read: ab is the live battery baseline, cd is a TRAINED alternative (did training install the trained formats evenly?), and xy / ab_lower are the HELD-OUT probes M0 v3 deliberately never trains (unseen words and unseen case respectively) — the only genuine out-of-distribution generalisation reads. Both hold-outs are reserved: never add them to m0/prompts.py (tests/test_heldout_probe_schemes.py pins this).
        max_options: 6
        subset_seed: 0
        schemes: "ab,cd,xy,ab_lower"
        wordings: "baseline,coding_task"
        reasoning: "on"
        # v2 (2026-09-15): the 2026-08-05 run left prompt_style unset, so its reference variant asked the world-state default stem rather than the coding battery's question. coding_task_battery is that battery's exact prompt (tests/test_coding_task_prompt_parity.py). The v2 suffix keeps these summaries apart from the v1 files export_method_numbers.py selects. Runbook: docs/robustness-rerun-runbook.md.
        prompt_style: coding_task_battery
        save_suffix: forced_choice_robustness_v2
        # save_dir omitted -> defaults to results/<model_key>/label_variants for a free structure check, add `-- --dry-run` on the CLI

    # Repeats of the coding reference variant alone (baseline wording, A/B), run twice per model in the same session as score_label_variants. Generation is unseeded at temperature 1.0, so repeats differ only by sampling; their agreement with the main run's reference is the noise floor the variant-vs-reference differences are read against. ~300 generations per invocation.
    score_label_variants_reference_repeat:
      path: scripts/score_label_variants.py
      enabled: false # pass a live model_key via `-- --model_key <key>`
      args:
        options_path: [data/options/coding.json]
        prompt_style: coding_task_battery
        max_options: 6
        subset_seed: 0
        schemes: "ab"
        wordings: "baseline"
        reasoning: "on"
        save_suffix: forced_choice_robustness_v2_refrepeat

    # Values-arm robustness, on the pooled pool. Same checker the other flat pools use — `prompt_style: persona` makes its baseline the values stem, so variants are compared against the question the values battery actually asks.
    #
    # This check was previously untestable, not merely unrun. The matched-pair version reported `informative: false` for four of five conflicts because their baselines sat at ~0.50, and its own summary notes that an indifferent baseline makes the whole check meaningless — a variant that breaks the model's ability to answer also drives every edge to 0.50, so "no change" and "total failure" are the same reading. Pooled portraits have real spread, so wording and label sensitivity become measurable for the first time.
    #
    # Once per model, after the pooled baseline exists — not per checkpoint.
    score_label_variants_values:
      path: scripts/score_label_variants.py
      enabled: false # pass a live model_key via `-- --model_key <key>`
      args:
        options_path: [data/options/values.json]
        prompt_style: persona
        max_options: 6
        subset_seed: 0
        # Without these the script falls back to its own defaults, and the wording default is "baseline,coding_task" — a coding question asked of value portraits, which is not a wording variant but a category error. (These three keys previously sat under score_anticipation_label_variants, which has no --schemes/--wordings flags at all and would have crashed on them; moved here 2026-07-31.) persona_prefer varies the values stem's verb; the scheme list is the same four-way read as the coding entry above: ab baseline, cd trained-evenness, xy and ab_lower the held-out out-of-distribution probes M0 never trains.
        schemes: "ab,cd,xy,ab_lower"
        wordings: "baseline,persona_prefer"
        # v2 (2026-09-15): the 2026-08-05 run had no reasoning key, so it fell back to the scorer's answer-only logprobs default (30 prompts per variant) while run_utilities_values samples K=10 with reasoning. Pinned on so the check exercises the battery's elicitation. ~2,400 generations.
        reasoning: "on"
        save_suffix: forced_choice_robustness_v2

    # Values counterpart of score_label_variants_reference_repeat: the reference variant alone, run twice per model for the noise floor. ~300 generations per invocation.
    score_label_variants_values_reference_repeat:
      path: scripts/score_label_variants.py
      enabled: false # pass a live model_key via `-- --model_key <key>`
      args:
        options_path: [data/options/values.json]
        prompt_style: persona
        max_options: 6
        subset_seed: 0
        schemes: "ab"
        wordings: "baseline"
        reasoning: "on"
        save_suffix: forced_choice_robustness_v2_refrepeat

    # Forecast-side measurement validity for the ternary anticipation arms — the gap
    # score_label_variants does not cover, since it varies A/B labels for the flat option pools
    # only. The pairwise batteries ask every edge in both orders; the anticipation arms present
    # MORE/LESS/SAME in one fixed order with three fixed words and had no equivalent control.
    #
    # Deliberately NOT in the `robustness:` list above: it takes one --arm per invocation, so run
    # it by name three times (values / ue / coding) rather than as part of the batch.
    #
    # Read the result as direction-vs-magnitude, not pass/fail. On 9B M0 all three arms stayed
    # negative in every variant with P(MORE) <= 0.11 (direction robust), while order-matched the
    # word scheme moved mean net by +0.084 (values) / +0.167 (UE) / +0.083 (coding) and position by
    # -0.061 after counterbalancing out a -0.022-per-run session drift. Always counterbalance run
    # order in a variant sweep, or score baseline both first and last: scoring baseline first in
    # every sweep initially overstated the position effect by 0.022. Those numbers are v2-era: they
    # were measured on an M0 whose 61 ternary traces all used the fixed string "MORE, LESS, or
    # SAME", which made every non-baseline variant out-of-distribution. M0 v3 trains all three
    # cyclic rotations of MORE/LESS/SAME and HIGHER/LOWER/UNCHANGED, so the rotations and hilo are
    # now IN-distribution: the battery itself counterbalances position (label_rotations: 3 above),
    # baseline-vs-hilo measures whether training installed the trained formats evenly, and TWO
    # held-out schemes carry the out-of-distribution read — GREATER/SMALLER/UNCHANGED and
    # STRONGER/WEAKER/UNCHANGED. Both are held out on their up/down words and share the trained
    # flat word UNCHANGED deliberately, so every alternative variant varies exactly one factor and
    # a P(flat) difference between them is attributable to the up/down words.
    # Re-measure the test-retest floor with --repeats under v3 before citing the v2 constants.
    # See the superseding note in docs/methodology-working-doc.md (forecast-side measurement
    # validity).
    #
    # --repeats N is the forecast-side analogue of the pre-registered ground-truth tau: it measures
    # test-retest spread of anticipation_net under identical reruns, the floor any wording or
    # position effect must clear.
    score_anticipation_label_variants:
      path: scripts/score_anticipation_label_variants.py
      enabled: false # pass a live model_key via `-- --model_key <key> --arm <arm>`
      args:
        arm: values
        n_targets: 30 # spread round-robin over each battery's groups; --all_targets for full width
        K: 10
        reasoning: "on"
        # ~3,000 generations per arm (30 x 10 variants x K=10) ~= 6 min at the measured 8.7 gen/s.
        # save_dir omitted -> defaults to results/<model_key>/anticipation_label_variants
        #
        # The coding arm needs different flags because it cannot be subset (see the script's ARMS
        # table): the committed battery is 104 prompts per variant, so at K=10 x 10 variants it is
        # 10,400 generations. Run it instead as
        #   -- --arm coding --K 4 --variants baseline,down_last,hilo,strength,heldout
        # which is 2,080 generations (~4 min) at *better* precision than the 30-target arms: SE of
        # the variant mean is ~0.026 vs ~0.031, because 104 prompts more than compensates for the
        # lower K. This is the same trade the retired matched-pair robustness checker made -- a
        # paired variant-vs-baseline contrast needs far less per-cell precision than an absolute
        # utility estimate -- and five variants suffice once the word and position effects are
        # already established in two other arms: baseline vs hilo gives the trained word effect,
        # down_last gives one position contrast, strength and heldout give the two
        # out-of-distribution reads, and only the order-by-word interaction is lost (measured near
        # zero in both values and UE).

    # Functional-correctness check: does the coding SFT trajectory actually get better at
    # coding, execution-verified, or is the preference-drift signal moving on its own? NOT
    # SWE-bench (see scripts/score_coding_capability.py docstring for why: per-instance repo
    # checkout + env install + full test-suite run is heavy and Python-only; this study trains
    # java/rust/cpp too). Instead: 202 problems sampled from the real coding-SFT source data
    # (data/training/coding.write.<lang>/{pool,validation}.jsonl) -- 81 from pool.jsonl
    # (in-distribution, may have been directly trained on) and 121 from validation.jsonl
    # (structurally guaranteed never trained on), so pool vs. held-out pass rate separates
    # in-distribution retention from genuine held-out generalization. Per language (pool/held-out):
    # python 37/68, java 19/13, rust 12/22, cpp 13/18. Every problem is single-language; graded by
    # real execution, with expected values corroborated against two independent model families.
    # Cheap -- run it per checkpoint you care about (e.g. step0 vs step125 of one arm).
    #
    # See docs/coding-capability-eval.md before interpreting the numbers: scores are comparable only
    # within one instrument version (--max_tokens, bank and answer key all move them), the reported
    # likely_truncated_rate should be read first, and absolute pass rates are a within-language
    # before/after signal rather than a capability benchmark.
    score_coding_capability:
      path: scripts/score_coding_capability.py
      enabled: false # pass a live model_key via `-- --model_key <key>`
      args: {}
        # model_key drives everything: --languages defaults to the trained arm inferred from
        # the checkpoint key (e.g. ...-python-step40-... -> python only); pass --languages
        # python,java,rust,cpp explicitly to also check cross-language spillover.
        # save_dir omitted -> defaults to results/<model_key>/coding_capability

    # run_utilities computes a Thurstonian utility over an options set. One entry per battery (different options_path + category folder). NO config_key: reasoning-on auto-selects the sampling config; a *_logprobs config_key hard-errors with it.
    #
    # NOT in the battery (dropped 2026-07-16): Book A pools these same 18 items with coding on one shared scale, so every other-vs-other contrast is readable from the Book A fit and this standalone run adds no information (~4k generations saved per battery). Kept in the registry so it can be run by name as a scale-stability check (do other-item utilities move when coding items share the pool?).
    run_utilities_other:
      path: scripts/run_utilities.py
      enabled: false
      args:
        options_path: [data/options/other.json]
        category: other # -> results/<model_key>/other
        reasoning: "on"

    # "Book A" = coding + other on ONE shared utility scale, for direct cross-domain comparison. NOT redundant with run_elicitations_task: that measures coding-only task preference ("which would you rather do now?", same coding.json); Book A pools coding WITH other so a coding task's utility is comparable to an "other" activity's on the same axis.
    run_utilities_book_a:
      path: scripts/run_utilities.py
      enabled: false
      args:
        options_path: [data/options/coding.json, data/options/other.json]
        category: book_a # -> results/<model_key>/book_a
        reasoning: "on"
        # MUST be pinned. run_utilities defaults to the upstream emergent-values "which implied state of the world would you prefer?" stem, which suits UE (items phrased as states, "You receive $500...") and is a category mismatch here: all 45 Book A items are bare instructions ("Write a small, self-contained program in Python..."). Runs before 2026-07-29 inherited that default silently, because run_utilities had no template argument at all -- so the pooling this battery was designed for came with an undeclared change of question. Measured cost on M0-v2: Book A and the coding task-preference battery rank the SAME 27 item strings at Spearman 0.86 on the 9B (0.99 on the 4B) against a 0.99 reliability ceiling, and refitting Book A on coding-vs-coding edges only leaves it at 0.85, which rules out the pooling and leaves the prompt. "task" is the same stem run_elicitations task-preference uses, generalised from "two coding tasks" to "two tasks" because this pool is coding + other. See analysis/analyze_position_and_convergence.py.
        prompt_style: task

    # The values arm, scored the way every other battery is scored: all 90 Schwartz portraits on ONE shared Thurstonian scale, adaptive edge sampling, holdout accuracy reported. Replaces the matched-pair scorer retired on 2026-07-29 (scripts/score_value_pairs_DEPRECATED.py, no longer registered here; full evidence in docs/values-utilities.md). That design compared each portrait against exactly one opponent -- its antipode in the identical situation -- and averaged the 9 results into a per-conflict win rate, which confounds a portrait's general appeal with the value it enacts and averaged to ~0.50 in four of five conflicts even though the individual pairs inside them were decisive.
    #
    # What changed and what did NOT. The stimuli are untouched -- same 90 portraits, same file,
    # same wording -- and `prompt_style: persona` is copied byte-for-byte from
    # values_preferences.json, so the model is asked an identical question. The only change is
    # which portraits get compared against which. The old design gave every portrait exactly ONE
    # comparison (its antipode in the same situation) and averaged 9 of those into a per-conflict
    # win rate. That makes a portrait's own appeal and the value it enacts perfectly
    # confounded -- not hard to separate, unidentifiable -- and it is why 32 of the 45 matched
    # pairs put both portraits on the same side of their own scale, and why four of five
    # conflicts averaged to ~0.50 while their individual pairs were decisive (see
    # docs/values-utilities.md). Pooling gives each portrait many opponents, so it gets its own
    # utility and pole coherence becomes a testable result rather than an assumption.
    #
    # Cost: ~90 options, comparable to the 81-item UE battery (~25k generations, 1-2h on the serving box). Note this is INFERENCE -- per the Inference Rule in docs/cost.md it does not go on the paid training budget.
    run_utilities_values:
      path: scripts/run_utilities.py
      enabled: false # pass a live model_key via `-- --model_key <key>`
      args:
        options_path: [data/options/values.json]
        category: values # -> results/<model_key>/values
        reasoning: "on"
        # MUST be pinned, for the same reason Book A pins "task". The run_utilities default is the upstream world-state stem ("which implied state of the world would you prefer?"), which asks about an outcome when a portrait describes a disposition. "persona" is the values wording score_value_pairs has always sent. Leaving this unpinned would confound the design change with a change of question, which is the one thing this re-score promised not to do.
        prompt_style: persona

    run_utilities_ue:
      path: scripts/run_utilities.py
      enabled: false
      args:
        options_path: [data/reference/ue_options_subset.json]
        category: ue # -> results/<model_key>/ue
        reasoning: "on"

    # run_elicitations.py has three argparse subcommands with distinct flag sets; each gets its own registry entry, selected via `positional:`.
    run_elicitations_task:
      path: scripts/run_elicitations.py
      positional: [task-preference]
      enabled: false # pass a live model_key via `-- --model_key <key>`; has no --dry-run
      args:
        reasoning: "on"
        # save_dir omitted -> defaults to results/<model_key>/pairs

    run_elicitations_training:
      path: scripts/run_elicitations.py
      positional: [training-preference]
      enabled: false # pass a live model_key via `-- --model_key <key>`; has no --dry-run
      args:
        level: described_dataset
        reasoning: "on"
        # save_dir omitted -> defaults to results/<model_key>/pairs

    # ---- Anticipation: two arms, run together via `main.py --anticipation` ----
    #
    # Arm 1 (coding): "if trained on <dataset>, would you want <task> MORE/LESS/SAME?" 4 anchors (the interventions actually trained) x 26 targets = 136 prompts. Levels are asymmetric: every target at described_dataset, plus the other two concreteness levels for the 4 trained tasks only — a full 3x cross would be 312 prompts for a level effect that only needs answering on the trained tasks.
    #
    # WITHOUT --model_key this exports prompts and queries nothing: a genuinely free dry run.
    run_elicitations_anticipation:
      path: scripts/run_elicitations.py
      positional: [anticipation]
      enabled: false # safe to enable without model_key: prompt-export only, no scoring
      args:
        experiment_spec: data/experiment_specs/coding_drift_anticipation_v2.json
        level: all
        target_set: all
        # K is per rotation: 3 rotations x K=4 = 12 samples per forecast (136 forecasts -> 408 prompts, 1,632 generations per model, baseline-only). The script default is K=1, which is a single coin-flip per cell and cannot be alpha-scored.
        K: 4
        # Counterbalance answer position: 3 cyclic label rotations x K=4 = 12 samples per
        # forecast, replacing the old single-order K=10. Each of MORE/LESS/SAME lands in each
        # position exactly once, which is the ternary analogue of the pairwise batteries'
        # original/flipped design. Measured on 9B M0 v2, the fixed order was worth about -0.06 of
        # net; rotation removes it rather than leaving it in every forecast. Requires an M0 whose
        # ternary format training varies label order (v3+) -- on a single-order M0 the rotations
        # are out-of-distribution. Costs +20% generations vs K=10.
        label_rotations: 3
        output_path: prompts/coding_drift_anticipation_v2.jsonl
        # model_key: qwen35-08b-local   # add to actually query a model instead of only exporting

    # UE cross-domain arm: its own standalone runner (like the RL arm), so the coding anticipation CLI and spec are untouched. Same four coding anchors, but every one of the 81 UE options as a target, forecasting spillover onto the broad UE battery. Reworded prompt (UE items are outcomes, not "tasks"). described_dataset only (level: primary): the concreteness sweep is reserved for the trained tasks. 81 targets x 4 anchors x 10 = 3240 generations, baseline-only. WITHOUT --model_key it only exports prompts.
    run_elicitations_ue_anticipation:
      path: scripts/run_ue_anticipation.py
      enabled: false # safe to enable without model_key: prompt-export only, no scoring
      args:
        experiment_spec: data/experiment_specs/ue_drift_anticipation_v2.json
        level: primary
        target_set: all
        K: 4
        # Counterbalance answer position: 3 cyclic label rotations x K=4 = 12 samples per
        # forecast, replacing the old single-order K=10. Each of MORE/LESS/SAME lands in each
        # position exactly once, which is the ternary analogue of the pairwise batteries'
        # original/flipped design. Measured on 9B M0 v2, the fixed order was worth about -0.06 of
        # net; rotation removes it rather than leaving it in every forecast. Requires an M0 whose
        # ternary format training varies label order (v3+) -- on a single-order M0 the rotations
        # are out-of-distribution. Costs +20% generations vs K=10.
        label_rotations: 3
        output_path: prompts/ue_drift_anticipation_v2.jsonl
        # model_key: qwen35-08b-local   # add to actually query a model instead of only exporting

    # ---- RL method comparison: separate from the existing data-preference CLI ----
    # Both variants use sampled text through the dedicated RL runner and its RL-local request-level native-thinking profiles.
    run_rl_preferences_thinking:
      path: scripts/run_rl_anticipation_preferences.py
      positional: [rl-preferences]
      enabled: false
      args:
        level: all
        thinking: "on"

    run_rl_preferences_non_thinking:
      path: scripts/run_rl_anticipation_preferences.py
      positional: [rl-preferences]
      enabled: false
      args:
        level: all
        thinking: "off"

    run_rl_anticipation_thinking:
      path: scripts/run_rl_anticipation_preferences.py
      positional: [rl-anticipation]
      enabled: false
      args:
        experiment_spec: data/experiment_specs/rl_anticipation.json
        level: all
        target_set: all
        # 3 rotations x K=4 = 12 position-counterbalanced samples per forecast, matching the executed coding/UE/values forecast design (the old single-order K=10 predates M0 v3 rotations; RL anticipation scores M0-v4-lineage endpoints, so rotations are in-distribution).
        K: 4
        label_rotations: 3
        thinking: "on"
        output_path: prompts/rl_anticipation_thinking.jsonl

    run_rl_anticipation_non_thinking:
      path: scripts/run_rl_anticipation_preferences.py
      positional: [rl-anticipation]
      enabled: false
      args:
        experiment_spec: data/experiment_specs/rl_anticipation.json
        level: all
        target_set: all
        K: 4
        label_rotations: 3
        thinking: "off"
        output_path: prompts/rl_anticipation_non_thinking.jsonl

    # Matched two-method headline using only the real DPO and corrected
    # 1,000-prompt GRPO artifacts.
    run_dpo_grpo_rl_preferences_thinking:
      path: scripts/run_rl_anticipation_preferences.py
      positional: [rl-preferences]
      enabled: false
      args:
        comparison: dpo-grpo
        level: all
        thinking: "on"
        no_timestamp: true

    run_dpo_grpo_rl_preferences_non_thinking:
      path: scripts/run_rl_anticipation_preferences.py
      positional: [rl-preferences]
      enabled: false
      args:
        comparison: dpo-grpo
        level: all
        thinking: "off"
        no_timestamp: true

    run_dpo_grpo_rl_anticipation_thinking:
      path: scripts/run_rl_anticipation_preferences.py
      positional: [rl-anticipation]
      enabled: false
      args:
        comparison: dpo-grpo
        level: all
        target_set: all
        K: 4
        label_rotations: 3
        thinking: "on"
        no_timestamp: true
        output_path: prompts/rl_dpo_grpo_anticipation_thinking.jsonl

    run_dpo_grpo_rl_anticipation_non_thinking:
      path: scripts/run_rl_anticipation_preferences.py
      positional: [rl-anticipation]
      enabled: false
      args:
        comparison: dpo-grpo
        level: all
        target_set: all
        K: 4
        label_rotations: 3
        thinking: "off"
        no_timestamp: true
        output_path: prompts/rl_dpo_grpo_anticipation_non_thinking.jsonl

    # The values anticipation arm, mirroring run_elicitations_ue_anticipation exactly:
    # ternary MORE/LESS/SAME over all 90 portraits, dataset-description level only, crossed
    # with the four trained coding anchors. 90 x 4 = 360 prompts, K=10 -> ~3,600 generations,
    # the same order as the A/B forecast it replaces.
    #
    # Why it changed: the old forecast asked the A/B matched-pair question, which was chosen so forecast and ground truth were the same quantity and alpha needed no no-change band. That only holds while the ground truth IS a matched win rate. With the pooled scale each portrait has its own utility at each checkpoint, so a per-portrait ternary forecast has a directly measured counterpart, and the values arm stops being the one special case.
    #
    # The model is still never told which value a portrait enacts — only the response format changed, not what is shown.
    #
    # Alpha uses the pre-registered tau rule under analysis.anticipation_alpha: estimate a book-specific no-change band from repeated no-training utility reruns, then classify post-minus-pre movement as MORE / LESS / SAME against that band. Run this to record the forecast; do not report alpha for any book whose tau is not calibrated and frozen.
    run_values_anticipation:
      path: scripts/run_values_anticipation.py
      enabled: false # safe to enable without model_key: prompt-export only, no scoring
      args:
        experiment_spec: data/experiment_specs/values_drift_anticipation_v2.json
        level: primary
        target_set: all
        K: 4
        # Counterbalance answer position: 3 cyclic label rotations x K=4 = 12 samples per
        # forecast, replacing the old single-order K=10. Each of MORE/LESS/SAME lands in each
        # position exactly once, which is the ternary analogue of the pairwise batteries'
        # original/flipped design. Measured on 9B M0 v2, the fixed order was worth about -0.06 of
        # net; rotation removes it rather than leaving it in every forecast. Requires an M0 whose
        # ternary format training varies label order (v3+) -- on a single-order M0 the rotations
        # are out-of-distribution. Costs +20% generations vs K=10.
        label_rotations: 3
        output_path: prompts/values_drift_anticipation_v2.jsonl
        # model_key: qwen35-9b-m0-v2-aws   # add to actually query a model instead of only exporting

    # ---- Phase 2: Big5 trait-axis batteries 
    run_big5_anticipation:
      path: scripts/run_big5_anticipation_preferences.py
      positional: [anticipation]
      enabled: false # safe without model_key: prompt-export only, no scoring
      args:
        battery: values
        level: all
        target_set: all
        K: 4
        label_rotations: 3
        reasoning: "on"

    # coding = reverse-direction spillover: the same four anchors onto the 26 coding/activity targets
    # from coding_drift_anticipation, asked once at described_dataset (104 forecasts). Required by the
    # same argument as the coding->values forecast: Phase 2 re-scores all Phase 0 batteries after
    # training, and a battery that can drift needs a pre-registered forecast.
    run_big5_coding_anticipation:
      path: scripts/run_big5_anticipation_preferences.py
      positional: [anticipation]
      enabled: false
      args:
        battery: coding
        level: primary
        target_set: all
        K: 4
        label_rotations: 3
        reasoning: "on"

    # Pairwise A/B dataset choice over the four arms, Thurstonian per level (6 unordered pairs,
    # order-counterbalanced -> 12 prompts per level). One entry per concreteness level because all
    # three are part of the design rather than alternatives: the choice-vs-dataset contrast is what
    # isolates the label effect. Run all three, or none, to keep the levels comparable.
    run_big5_training_preference_choice:
      path: scripts/run_big5_anticipation_preferences.py
      positional: [training-preference]
      enabled: false # requires --model_key; this one scores, it cannot dry-run
      args:
        level: described_choice
        reasoning: "on"

    run_big5_training_preference_dataset:
      path: scripts/run_big5_anticipation_preferences.py
      positional: [training-preference]
      enabled: false
      args:
        level: described_dataset
        reasoning: "on"

    run_big5_training_preference_examples:
      path: scripts/run_big5_anticipation_preferences.py
      positional: [training-preference]
      enabled: false
      args:
        level: example_datapoints
        reasoning: "on"

    # Deterministic n=1000 seed-42 draw from the committed pool. Re-running is free and idempotent; prepared sets live in gitignored results/ and are reproduced from the pool + this seed, so a fresh box just runs this before training.
    prepare_sft_dataset:
      path: scripts/prepare_sft_dataset.py
      enabled: false # run via `--sft` or by name; no served model involved
      accepts_model_key: false # script has no --model_key flag
      args:
        spec_path: data/training_specs/coding_axis_sft.json
        intervention_id: coding.write.python
        sample_count: 1000
        seed: 42
        # Size-agnostic on purpose: the prepared set is a seeded draw from a committed pool with no tokenizer involved, so 4B and 9B train on byte-identical data and share one prepared directory. `--size` therefore has nothing to move in this entry.
        output_dir: results/sft_datasets/coding.write.python_n1000_seed42

    train_sft_lora:
      path: scripts/train_sft_lora.py
      enabled: false # needs prepared train/validation JSONL plus GPU-capable HF/TRL deps
      accepts_model_key: false # script has no --model_key flag
      args:
        spec_path: data/training_specs/coding_axis_sft.json
        intervention_id: coding.write.python
        dataset_dir: results/sft_datasets/coding.write.python_n1000_seed42
        # Base-model segment is load-bearing, not decoration: the arm+n+seed suffix is identical across sizes, so without it a 9B run started on a box that already trained 4B writes its checkpoints into the 4B run's directory, where nothing on disk distinguishes them. `--size 9b` moves this and base_model together.
        output_dir: results/sft_runs/qwen35-4b-m0-v4/coding.write.python_n1000_seed42
        # 4B headline base: the current M0-v4 warm-start, overriding the spec's 0.8B default_base_model. This MUST equal the base served during the trajectory (`vllm serve prism-drift/qwen35-4b-m0-v4 --enable-lora ...`) or the adapters compose against the wrong weights. Slug-derived push repo: prism-drift/qwen35-4b-m0-v4-phase-1-sft-adapters.
        base_model: prism-drift/qwen35-4b-m0-v4
        # Checkpoint cadence: at n=1000 / grad-accum 8 = 125 optimizer steps (1 epoch). save_steps=4 emits ~31 checkpoint dirs (steps 4,8,...,124) plus the end-of-run final adapter (step 125); step0 is the untrained baseline, scored separately. LoRA adapters are tens of MB and training is the cheap part of the budget, so saving densely is ~free — the cost is at SCORING time (one served-endpoint elicitation run per checkpoint MEASURED, per docs/cost.md), which is why far fewer are scored than saved. Dense saving just preserves the freedom to place those scored points where the drift curve is steepest (usually early). The qwen35-4b-codingsft-* and qwen35-9b-codingsft-* serve keys above score the trajectory at 5 front-loaded points per arm: step0 (baseline) + 4, 12, 40, 125. (The 0.8B debug keys this used to point at were removed 2026-07-29; the headline 4B/9B sets they anticipated now exist.)
        save_strategy: steps
        save_steps: 4
        # Adapter weights only -- no optimizer/scheduler/RNG state. Measured on the 4B (2026-08-06) and 9B (2026-08-07): optimizer state is ~2/3 of each checkpoint, and since the Hub push runs SYNCHRONOUSLY inside on_save, those bytes are paid for three times -- local disk, upload, and a blocked GPU during the Hub commit. That blocking push is why the L40S bought only 8% on training against 2.3x the hourly rate (docs/cost.md, 2026-08-06): a third of the step time was network, which no amount of memory bandwidth touches. Nothing here reads optimizer state; it exists only for --resume_from_checkpoint, which no run in this project has used, and the two are now a hard error together.
        save_only_model: true
        # Push each checkpoint to HuggingFace the moment it is written. results/ is gitignored on an ephemeral box, so an un-pushed checkpoint dies with the instance — and a Spot reclaim mid-run would take every checkpoint with it. {base_model_slug} is substituted at runtime (Qwen/Qwen3.5-0.8B -> qwen35-08b), so 4B adapters can never land in the 0.8B repo even if someone overrides --base_model and forgets this line. ONE repo per base model; each intervention is pushed to its own folder inside it (prefix = intervention_id), so arms never overwrite each other:
        #   qwen35-08b-phase-1-sft-adapters/coding.write.python/checkpoint-1 ... checkpoint-8
        #   qwen35-08b-phase-1-sft-adapters/coding.write.java/checkpoint-1   ...
        # "phase-1" disambiguates from phase 2, which trains its own SFT adapters.
        # Needs HUGGINGFACE_HUB_TOKEN (or HF_TOKEN) with write scope; `hf auth login` works too.
        hub_repo_id: "prism-drift/{base_model_slug}-phase-1-sft-adapters"
        # PUBLIC, and it has to be. Measured 2026-08-06: private pushes fail at the commit endpoint with "Private repository storage limit reached" once the org's private quota is full, and because visibility is fixed at repo CREATION the failure is unrecoverable in-run -- the repo already exists private by the time you see the first warning, so `create_repo(private=False)` is a no-op and only `update_repo_settings` can rescue it. A ~390 MB adapter every 4 steps x ~31 saves x 4 arms x 2 sizes exhausts a private quota quickly; public repos are unquotaed. Training survives a failed push (checkpoints are on local disk and it retries at the next save), but the whole point of push_on_save is that an ephemeral box can die at any moment, so a silently un-pushed run is exactly the risk this was meant to remove.
        hub_private: false
        push_on_save: true
        # The end-of-training push writes the final adapter (step 125) into its arm folder (<intervention_id>/, same namespacing as the checkpoints), so arms never overwrite each other. With save_steps=4 the last periodic checkpoint is checkpoint-124, so the final adapter is the true end-of-run weights (one step past it), not a duplicate — if its push ever fails, checkpoint-124 is the nearest saved fallback.

    # ---- DailyDilemmas: revealed-preference value expression (Chiu et al. 2025, arXiv:2410.02683) ----
    #
    # The independent value-expression benchmark the methodology pre-registers for the values arm
    # ("confirm the trained value is behaviourally present, independent of the preference
    # elicitation"). Data and upstream eval scripts are vendored under evals/daily_dilemmas/ with the
    # upstream CC-BY licence; scripts/run_daily_dilemmas.py drives them against our vLLM endpoints.
    #
    # It complements rather than duplicates the 90-portrait battery: portraits ask what the model
    # would rather BE (stated preference), dilemmas ask what it would DO (revealed). The headline
    # readout is the FLIP RATE — of 1,360 binary decisions, how many change after training — which is
    # a far better-powered behavioural measure than the 64-scenario style classifier.
    #
    # Binary forced choice, so the format is in-distribution for M0 and parse rate should match the
    # other binary batteries. Runs at temperature 0 by default: one forced choice per dilemma, and
    # determinism keeps sampling noise out of the flip rate.
    #
    # NOTE the value taxonomy is WVS / Moral Foundations / Virtue / Emotion / Maslow, NOT Schwartz,
    # so value-level results are not axis-comparable with the portraits battery.
    #
    # Needs a noise floor like every other drift claim here: run it TWICE on the untrained baseline
    # (second time with --output_path .../choices_run2.jsonl) and pass that as --replicate to analyse.
    run_daily_dilemmas:
      path: scripts/run_daily_dilemmas.py
      positional: [run]
      enabled: false # requires --model_key and a served endpoint
      args:
        order: both # counterbalance presentation order; upstream is forward-only
        temperature: 0.0

    # ---- Phase 2 manipulation check: did SFT actually install the trait style? ----
    #
    # The proximal-outcome gate that runs BEFORE a values battery on any new checkpoint. Generating
    # the 64 held-out replies costs 64 generations against ~25k for the values battery, so a
    # checkpoint that did not move gets caught for ~1/400th of the price. Both entries take their
    # paths and trait from --model_key, so the same pair works for every arm and every checkpoint:
    #   python main.py big5_generate_replies big5_score_manipulation --model_key <checkpoint key>
    # Run it once on the baseline (qwen35-4b-m0-v4-aws) too — the trained fraction is only meaningful
    # against the untrained one, and that baseline is NOT part of the Phase 0 batteries, which measure
    # preference rather than dialogue style.
    big5_generate_replies:
      path: scripts/big5_generate_validation_replies.py
      enabled: false # requires --model_key and a served endpoint
      args:
        temperature: 1.0

    big5_score_manipulation:
      path: analysis/big5_manipulation_check.py
      positional: [score]
      enabled: false # no served model needed; --model_key only names which replies file to read
      args: {}

