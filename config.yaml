# PPO's final checkpoint, 124 -- the same step count as GRPO by design (124 x batch 64 = 7936
# episodes = 8 passes over the 992-prompt clean cohort, matching GRPO's 8000 completions).
# Scored 2026-09-12 on BOTH instruments so it lands beside every other arm.
# Read this one against the reward model it was trained on: the RM score rose 0.39 -> 1.69 with KL
# reaching ~13, so PPO improved by its own learned reward. Whether rustc agrees is the entire point
# of measuring it here -- a large RM gain with no multi-LCB movement is reward hacking, and is a
# result rather than a failure.
qwen35-4b-ppo-rust-step124:
  model_name: "qwen35-4b-ppo-rust-s124"
