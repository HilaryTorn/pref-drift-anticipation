# 9B PPO, the two ends of the run, scored 2026-09-13. Unlike 4B -- where the RM score climbed
# 0.39 -> 1.69 and stayed there -- the 9B policy rose to a mid-run peak around step 64 and then
# regressed below where it started, so a single final-checkpoint cell cannot tell "PPO never gained
# capability" apart from "PPO gained it and then destroyed it". Both cells exist to separate those,
# and each is read against the stored 9B base on its own instrument (held-out 0.0551, v6 0.120,
# v345em same-session 2026-09-12) rather than against each other alone.
#
# Read step 124 with its training log beside it: termination fell 0.801 -> 0.016 across the run, so
# by the end almost nothing finishes inside the 2048-token training budget. On multi-LCB's
# 16384-token budget that surfaces as no_code_rate rather than as a hard zero, so compare pass@1
# and pass@1_given_code together per the instrument rule -- a conditioned delta on an arm whose
# termination moved this far is composition, not capability.
qwen35-9b-ppo-rust-step64:
