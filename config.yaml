# --- 9B LCB Rust arm: the dose-selection arm for the 9B size ---
# Dose is chosen per model size on the rust curve and then applied unchanged to that size's other
# arms; rust is the tuning arm and is reported as such. 4B picked epoch 3 because 4B rust improves
# monotonically (0.091 -> 0.183 -> 0.223). The 9B gets its own curve because the same 264 optimizer
# steps on twice the parameters is not the same amount of training -- larger models fit faster and
# may be past peak at epoch 3.
# The 9B baseline key is qwen35-9b-m0-v4-aws (already above): its model_name does not collide with
# the 4B, so it lands in v6_qwen35-9b-m0-v4_cot correctly with no prefix needed.
