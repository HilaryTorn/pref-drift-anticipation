  model_name: "lcb-go-ep2"
  model_type: vllm_endpoint
  base_url: "http://localhost:8000/v1"
  gpu_count: 1

# --- C# arm, first readout. Adapters coding.write.csharp/checkpoint-{176,264} = epochs 2 and 3. ---
# C# is the pre-registered test of "effect size tracks how competent the base already was". Ordered by
# M0 pass@1_given_code: rust 0.205 -> +0.131, go 0.333 -> +0.046, php 0.537 -> -0.034. C# is the
# highest at 0.633 and has never been measured, so the prediction is that ep3 regresses MORE than php
# did. Registering it here before the run so the result cannot be read as a post-hoc fit.
# The competing story is plain overtraining at 3 epochs, which ep2 separates: overtraining predicts
# ep2 above ep3, displacement predicts ep2 at or below M0 whatever the dose. Rust already argues
# against pure overtraining -- it is still IMPROVING at ep3 (ep2 0.183 -> ep3 0.223).
qwen35-4b-lcbcsharp-ep2-aws:
  model_name: "lcb-csharp-ep2"
  model_type: vllm_endpoint
  base_url: "http://localhost:8000/v1"
  gpu_count: 1

