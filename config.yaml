# --- 27B LCB Rust arm: epoch sweep (trained 2026-09-08, 2 epochs per coding_rust_lcb_sft.json) ---
# Same dataset as the 4B and 9B Rust arms (coding.write.rust_lcb_n700_seed42, 700 train / 144 val),
# so 88 optimizer steps per epoch and checkpoints 88/176 are epochs 1/2. The 27B stops at 2 epochs
