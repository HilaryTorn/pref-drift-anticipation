# the run-to-run noise floor read directly off run1-vs-run2 of either model.
# These are grading handles, not new weights: model_name only has to differ so upstream writes each run
# into its own output/ directory. Run 2 generations landed in v6_lcb-go-ep3_cot on the way through and
# overwrote run 1's, which is exactly what a shared model_name does -- hence the distinct names here.
