# ============================================================================
# Datasets
#
# Configuration for building the datasets.
# ============================================================================
datasets:
  coding:
    repo_id: "ise-uiuc/Magicoder-OSS-Instruct-75K"
    split: "train"
    languages: ["python", "java", "rust", "cpp"]
    seed: 2026
    cap: 4565
    shuffle: true
    keep_columns: [] # keeps all
    path: data/training/coding/magicoder_balanced.jsonl

# ============================================================================
# Analysis
#
# Pre-registered analysis constants and calibration rules. These are not model
# configs and are read by analysis helpers, not by live scorers.
# ============================================================================
analysis:
  anticipation_alpha:
    schema: anticipation_alpha_v1
    forecast_signal: anticipation_net # P(MORE) - P(LESS), SAME votes pull toward 0.
    utility_delta: post_utility_mean_minus_pre_utility_mean
    observed_drift_labels:
      more: "delta > tau"
      less: "delta < -tau"
      same: "abs(delta) <= tau"
    tau:
      status: preregistered_calibration_required
      unit: thurstonian_utility_mean
      calibration_method: repeated_no_training_reruns
      min_replicates_per_book: 2
      estimator: q95_abs_delta
      formula: "tau_book = quantile(abs(utility_run_b - utility_run_a), 0.95)"
      required_before_reporting_alpha: true
      notes: "Estimate tau separately for each measured utility book using repeated runs of the same untrained checkpoint, scorer config, prompt style, K, and option set. Alpha may be recorded as pending, but must not be reported for a book until that book's tau is calibrated and frozen."

# ============================================================================
# Models
#
# Serving is decided: we score against our own self-hosted vLLM endpoint
# (no hosted API serves our checkpoints). The study is Qwen3.5 throughout. For a
# causal drift run, baseline, training, and post-training scoring must use the same
# base-model family, so the SFT trains the same Qwen3.5 family the baselines measure.
# The SFT stack is pinned to a Qwen3.5-capable Transformers source build and checked
# by scripts/preflight_qwen35.py before GPU time.
# Stand endpoints up via docs/serving-vllm-aws.md.
#
# model_type options the scorer currently understands:
#   vllm | vllm_base_model | huggingface   local-to-the-box inference (needs `path`)
#   openai | anthropic | xai | togetherai  hosted via LiteLLM (needs api_keys/api_key_<type>.txt)
#   vllm_endpoint                          our self-hosted vLLM OpenAI-compatible endpoint
#                                          (needs `base_url` + api_keys/api_key_vllm_endpoint.txt;
#                                           `model_name` = the `vllm serve --served-model-name`).
#                                          Stand it up via docs/serving-vllm-aws.md.
# ============================================================================

# ---- Qwen3.5 base-model endpoints (per methodology: 0.8B debug, 4B & 9B headline) ----
qwen35-08b-base-aws:
  model_name: "qwen35-08b-base"
  model_type: vllm_endpoint
  base_url: "http://localhost:8000/v1"
  gpu_count: 1

# 4B/9B base-model endpoints. model_name = the `vllm serve --served-model-name`; the base weights served are Qwen/Qwen3.5-4B and Qwen/Qwen3.5-9B respectively.
qwen35-4b-base-aws:
  model_name: "qwen35-4b-base"
  model_type: vllm_endpoint
  base_url: "http://localhost:8000/v1"
  gpu_count: 1

qwen35-9b-base-aws:
  model_name: "qwen35-9b-base"
  model_type: vllm_endpoint
  base_url: "http://localhost:8000/v1"
  gpu_count: 1

# M0 v4 (2026-08-05): the current step-0 format model, and the only M0 anything new should target. Same six-bullet warm-start recipe as v2/v3, on a dataset whose ternary items vary BOTH label order and label words (m0/prompts.TERNARY_LABEL_SCHEMES: 4 schemes x 3 cyclic rotations). v2 trained every ternary example on the single string "MORE, LESS, or SAME", which left a ~-0.06 answer-position effect in every forecast and made the anticipation battery's rotated/relabelled robustness variants out-of-distribution and therefore uninterpretable.
#
# That rotation property is what the rotated battery (experiments.anticipation, label_rotations: 3) requires, and it is why v4 is NOT poolable with v2: scoring a rotated battery against v2 asks two of the three orders the model has never seen.
#
# What separates v4 from v3 is the trace set, not the recipe. v3's traces came from the retired quota-chasing builder (`trace_budget` semantics, max_rounds 6, 39.5% yield on the 9B); v4's come from the assign-then-generate builder, which gives each question exactly one presentation before any generation and so delivers the balance by construction — 200 traces over 200 distinct questions, position- and label-balanced, audited and curated (data/rl/m0_sft_<size>_v4/).
#
# The v3 keys were removed on 2026-08-05 rather than kept alongside: v3 was built and scored (prism-drift/qwen35-<size>-m0-v3, still on the Hub; results/_testrun_<size>_m0_v3/) but is not part of the study going forward. Nothing is deleted on the Hub, so re-adding a key is how you re-score it — do that rather than pushing a v4 build over the v3 repo, which would leave those baselines describing weights that no longer exist.
#
# Served from prism-drift/qwen35-<size>-m0-v4. Built per size — the warm-start is self-distillation, so each size's traces must be generated by that size's own base.
qwen35-4b-m0-v4-aws:
  model_name: "qwen35-4b-m0-v4"
  model_type: vllm_endpoint
  base_url: "http://localhost:8000/v1"
  gpu_count: 1

# NOT a model. A grading handle for the Go SFT teacher cache (docs/lcb-sft-runbook.md): scripts/build_lcb_go_teacher.py writes hosted-teacher solutions into multi-lcb/output/<release>_lcb-go-teacher_cot/ in upstream's own cache format, and `score_multilcb.py --model_key lcb-go-teacher --evaluate_only` grades them with upstream's executor. The cache is complete before evaluation runs, so this base_url is never contacted; it only has to parse. model_name MUST equal the script's derived teacher name because upstream names the output folder after it.
lcb-go-teacher:
  model_name: "lcb-go-teacher"
  model_type: vllm_endpoint
  base_url: "http://localhost:9/v1"
  gpu_count: 0

# Same grading handle, Rust arm. build_lcb_go_teacher.py --language rust writes here; the key name is derived as lcb-<language>-teacher, so a new language needs a matching block or grading fails after the teacher spend.
lcb-rust-teacher:
