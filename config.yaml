# DPO's mid-training checkpoint, scored 2026-09-11 to separate learning from likelihood
# displacement. Pairwise accuracy saturates by step 20 (0.925) and step 125 adds only margin:
# 0.24 -> 5.44 while logps/chosen sinks -62.6 -> -189.2. Step 40 sits after the ranking is
# learned and before the displacement is severe (margin 0.95, logps/chosen -94.6), so if the
# DPO arm has capability anywhere, it is here. A step-40 score ABOVE step-125 is evidence the
# back half of DPO training destroyed capability rather than added it.
qwen35-4b-dpo-rust-step40:
  model_name: "qwen35-4b-dpo-rust-s40"
  model_type: vllm_endpoint
