# It only has meaning alongside a same-session Go baseline: serve M0 once with --languages go,php so
# the base covers both arms in one run. Even then ep2-vs-ep3 is an effect-size comparison across
# sessions, not head-to-head, since ep3's generations came from the 2026-09-04 15:17 session.
# The reason to bother: the 9B php/c# arms are trained and unevaluated, and if BOTH 4B arms peak below
# epoch 3 then the 9B readouts should start at ep1/ep2 rather than spending runs past the peak.
