# --- PHP dose sweep + replicate, one session (planned 2026-09-05) ---
# Run 1 found PHP ep3 BELOW its baseline: 0.246 -> 0.211 overall, and on the 80 problems M0 wrote PHP
# for, 43 -> 32 (+7/-18, p=0.043). Two weaknesses in that reading: it is a single run, and the M0 PHP
# generations came from an earlier serving session than the ep3 generations, which is the cross-session
# comparison the noise floor exists to forbid. Generating M0 here alongside ep1/ep2/ep3 fixes both --
# the M0-vs-ep3 pair in this session IS the replicate, and the epoch sweep tests whether the regression
# is overtraining (displacement of behaviour the base already had) rather than a bad pool.
# 704 pool rows at effective batch 8 = 88 steps/epoch, so ep1/ep2/ep3 are checkpoints 88/176/264 of
# prism-drift/qwen35-4b-m0-v4-phase-1-lcb-sft-adapters, coding.write.php.
# Keys MUST be remapped before serving or vLLM applies nothing silently (docs/serving-vllm-aws.md).
