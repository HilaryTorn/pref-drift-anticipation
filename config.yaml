# PORT 8010, not 8000: these are served over an SSH tunnel from the laptop, and 8000 is the
# port every other tunnel in this project uses. A second concurrent pod (another agent, another
# arm) tunnelling to its own model on 8000 would be indistinguishable from this one at the call
# site -- generation would silently score the wrong weights. Tunnel with
#   ssh -N -L 8010:localhost:8000 -p <ssh_port> root@<ssh_ip>
