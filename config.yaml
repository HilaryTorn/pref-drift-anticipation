# --- 27B Big5 openness arms, M0-FORMAT-REPAIRED (built 2026-09-09) ---
# The keys ABOVE are unmeasurable and must not be used for scoring. The Big5 SFT erased the answer
# format the elicitation parser requires: parse rates 0.006-0.26 against a 0.997 baseline, dose-monotone
# and pole-asymmetric (high 0.015, low 0.224 at step 125). The dropout is differential between poles,
# so win rates computed from it are artifacts, not measurements. Controlled against the LCB Rust arm,
# which ran on the same M0, same vLLM 0.28.0, same --enable-lora, same harness, in the same hour and
# parsed at 0.986-0.994: the cause is the Big5 dialogue SFT, not the serving stack.
# The repair: merge the Big5 adapter into M0 (m0/scripts/export_m0.py), then re-teach the forced-choice
# format with m0/train_warmstart.py on the SAME 200 M0 traces that installed it originally --
# 1 epoch / 13 steps / lr 1e-4 / effective batch 16, IDENTICAL on all eight arms. A per-checkpoint dose
# would confound Big5 dose with repair dose; do not "optimise" it per arm.
# Restored parse rates (60 real battery prompts, transformers path, on-box control at 0.017 matching
# the harness's 0.015): high 0.983 / 0.967 / 1.000 / 1.000 and low 0.983 / 1.000 / 1.000 / 1.000 for
# steps 4 / 12 / 40 / 125.
# CAVEAT for the paper: this is a MODIFIED intervention. The 4B and 9B arms kept format compliance with
# no repair, so a repaired 27B is not strictly like-for-like. Step 12 is the load-bearing cell -- it is
# the only dose measurable BOTH repaired and unrepaired (0.767 as-is), so it is where the claim that
# repair preserved the drift can actually be tested rather than asserted.
# These are MERGED 51 GB models, not adapters: one pod per arm, no adapter swapping, and no key remap.
# Serve the subfolder directly with variant A (parser ON, 8192) and NO --enable-lora.
# Weights: prism-drift/qwen35-27b-m0-v4-phase-2-big5-repaired, big5.openness.{high,low}.step{4,12,40,125}
