[project]
name = "ai-pref-drift"
version = "0.1.0"
description = "Studying task & training preferences in open-source LMs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate==1.14.0",
    "datasets==5.0.0",
    "huggingface-hub==1.24.0",
    "litellm==1.61.5",
    "networkx==3.6.1",
    "numpy==2.4.6",
    "pandas==3.0.3",
    "peft==0.19.1",
    "protobuf==7.35.1",
    "python-dotenv==1.2.1",
    "pyyaml==6.0.3",
    "scikit-learn==1.6.1",
    "torch==2.11.0",
    "tqdm==4.68.2",
    "transformers==5.14.1",
    "trl==1.9.0",
]

[tool.setuptools]
py-modules = []

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
